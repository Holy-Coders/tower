[package]
name = "tower"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tower"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 0.25+ required: tree-sitter-rust 0.24 emits grammar ABI 15; 0.24 caps at 14.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
